[build]
  publish = "."
  ignore = "if [ x$CONTEXT = xproduction ]; then git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- index.html netlify/ netlify.toml; else exit 1; fi"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
