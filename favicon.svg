<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="World Cup highlight tracker">
  <!-- brand green tile -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#1e5631"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="11.5" fill="none" stroke="#d9a52c" stroke-width="1.5" opacity="0.4"/>

  <!-- trophy handles (gold), behind the cup -->
  <g fill="none" stroke="#d9a52c" stroke-width="4" stroke-linecap="round">
    <path d="M21 17 C 9 19, 9 34, 22.5 33"/>
    <path d="M43 17 C 55 19, 55 34, 41.5 33"/>
  </g>

  <!-- neck + base (gold) -->
  <polygon points="27.5,34 36.5,34 35,43 29,43" fill="#d9a52c"/>
  <rect x="21" y="42.5" width="22" height="6.8" rx="2.2" fill="#d9a52c"/>
  <rect x="24" y="49.5" width="16" height="3.6" rx="1.5" fill="#c98f1f"/>

  <!-- cup bowl = soccer ball -->
  <circle cx="32" cy="24" r="13.5" fill="#fbfaf5"/>
  <!-- soccer pattern -->
  <polygon points="32,19 37.04,22.66 35.12,28.55 28.88,28.55 26.96,22.66" fill="#1b2a1f"/>
  <g stroke="#1b2a1f" stroke-width="1.6" stroke-linecap="round" fill="none">
    <line x1="32" y1="19" x2="32" y2="12.5"/>
    <line x1="37.04" y1="22.66" x2="43.20" y2="20.65"/>
    <line x1="35.12" y1="28.55" x2="38.95" y2="33.75"/>
    <line x1="28.88" y1="28.55" x2="25.05" y2="33.75"/>
    <line x1="26.96" y1="22.66" x2="20.80" y2="20.65"/>
  </g>
  <circle cx="32" cy="24" r="13.5" fill="none" stroke="#1e5631" stroke-width="0.9" opacity="0.22"/>
</svg>
